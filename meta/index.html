<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Meta</title>
  <link rel="stylesheet" href="../stye.css" />
  <script type="module" src="../global.js"></script>
  <style>
    /* Step 1.1: Slider layout */
    .slider-container {
      display: flex;
      flex: 1;
      align-items: baseline;
      gap: 1rem;
      margin-bottom: 1rem;
    }
 
    .slider-container label {
      display: flex;
      flex: 1;
      align-items: baseline;
      gap: 0.5rem;
    }
 
    .slider-container input[type="range"] {
      flex: 1;
    }
 
    .slider-container time {
      margin-left: auto;
      font-size: 0.9em;
      opacity: 0.7;
      white-space: nowrap;
    }
 
    /* Step 3.1: Scrollytelling two-column layout */
    #scrolly-1 {
      position: relative;
      display: flex;
      gap: 1rem;
    }
 
    #scrolly-1 > * {
      flex: 1;
    }
 
    #scatter-story {
      position: relative;
    }
 
    #scatter-plot {
      position: sticky;
      top: 0;
      left: 0;
      bottom: auto;
      height: 50vh;
    }
 
    /* Step 3.2: spacing for story steps */
    .step {
      padding-bottom: 4rem;
      line-height: 1.6;
    }
 
    /* Step 2.1: File dl grid layout */
    #files {
      display: grid;
      grid-template-columns: 1fr 4fr;
      margin-top: 2rem;
    }
 
    #files > div {
      grid-column: 1 / -1;
      display: grid;
      grid-template-columns: subgrid;
      margin-bottom: 0.5rem;
    }
 
    #files dt {
      grid-column: 1;
    }
 
    #files dd {
      grid-column: 2;
      display: flex;
      flex-wrap: wrap;
      align-items: start;
      align-content: start;
      gap: 0.15em;
      padding-top: 0.6em;
      margin-left: 0;
    }
 
    /* Step 2.2: Unit viz dots */
    .loc {
      display: flex;
      width: 0.5em;
      aspect-ratio: 1;
      background: var(--color, steelblue);
      border-radius: 50%;
    }
 
    /* Step 1.4: Entry transitions */
    circle {
      transition: all 200ms;
    }
 
    @starting-style {
      circle {
        r: 0;
      }
    }
 
    /* Tooltip */
    .tooltip {
      position: fixed;
      background: white;
      border: 1px solid #ccc;
      border-radius: 6px;
      padding: 0.5rem 1rem;
      pointer-events: none;
      opacity: 0;
      transition: opacity 200ms;
      font-size: 0.85rem;
      z-index: 100;
      box-shadow: 0 2px 8px rgba(0,0,0,0.15);
    }
  </style>
</head>
<body>
  <h1>Meta Analysis</h1>
  <p>Stats about the codebase behind this site.</p>
 
  <div id="stats"></div>
 
  <!-- Step 1.1: Slider UI -->
  <div class="slider-container">
    <label>
      Show commits until:
      <input type="range" id="commit-progress" min="0" max="100" value="100" />
      <time id="commit-time-display"></time>
    </label>
  </div>
 
  <!-- Step 3.1: Scrollytelling layout -->
  <div id="scrolly-1">
    <div id="scatter-story">
      <!-- Step 3.2: .step divs generated by JS -->
    </div>
 
    <div id="scatter-plot">
      <h2>Commits by time of day</h2>
      <div id="chart"></div>
      <p id="selection-count">No commits selected</p>
      <dl id="language-breakdown" class="stats"></dl>
    </div>
  </div>
 
  <!-- Step 2.1: File unit visualization (below scrolly section) -->
  <h2>File sizes over time</h2>
  <dl id="files"></dl>
 
  <!-- Tooltip -->
  <dl id="commit-tooltip" class="tooltip">
    <dt>Commit</dt><dd id="commit-id"></dd>
    <dt>Date</dt><dd id="commit-date"></dd>
    <dt>Time</dt><dd id="commit-time-tooltip"></dd>
    <dt>Lines edited</dt><dd id="commit-lines"></dd>
  </dl>
 
  <script type="module" src="main.js"></script>
</body>
</html>
