<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Meta</title>
    <link rel="stylesheet" href="../stye.css" />
  </head>
  <body>
    <nav>
      <!-- copy your nav from your other pages -->
    </nav>
    <h1>Meta Analysis</h1>
    <p>Stats about the codebase behind this site.</p>
    <div id="stats"></div>
    <h2>Commits by time of day</h2>
    <div id="chart"></div>
    <p id="selection-count">No commits selected</p>
    <dl id="language-breakdown" class="stats"></dl>
    <dl id="commit-tooltip" class="tooltip">
        <dt>Commit</dt><dd id="commit-id"></dd>
        <dt>Date</dt><dd id="commit-date"></dd>
        <dt>Time</dt><dd id="commit-time"></dd>
        <dt>Lines edited</dt><dd id="commit-lines"></dd>
    </dl>

    <script type="module" src="main.js"></script>
  </body>
</html>
